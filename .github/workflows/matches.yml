name: Sync de jogos e classificação

on:
  schedule:
    # 3x/dia (horários UTC — 09h, 18h e 00h de Fortaleza)
    # A cada 15 min: 3x/dia não acompanha placar em dia de jogo. O GitHub
    # estrangula cron em repositório público, então na prática cai para ~30-60
    # min — ainda muito melhor que 8 horas. O painel serve de reforço manual.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: matches
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --filter @netfor/scraper --filter @netfor/db

      - name: Sincronizar jogos e classificação
        run: pnpm --filter @netfor/scraper matches
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}

name: Sync de jogos e classificação

on:
  schedule:
    # A cada 30 min. O GitHub estrangula cron em repositório público, então na
    # prática cai para ~30-60 min — suficiente para acompanhar placar sem ficar
    # cutucando o banco. Era */15, mas cada execução acorda o compute do Neon e
    # ele só suspende após 5 min ocioso: dobrar o intervalo corta pela metade as
    # horas de compute, que é o recurso escasso do plano free. O painel e o
    # workflow_dispatch servem de reforço manual em dia de jogo.
    #
    # Desde que o sync passou a revalidar só quando algo muda de fato, rodada
    # sem novidade não custa mais nada de cache.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: matches
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 10 min não cabe mais: em dia de jogo o script entra de plantão e fica
    # acordado até a escalação sair (teto próprio de 100 min no código). O
    # timeout aqui é a rede de segurança acima daquele teto, não o controle —
    # quem encerra o plantão é o script. Minuto de Actions em repositório
    # público é gratuito, então esperar acordado não custa cota.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --filter @netfor/scraper --filter @netfor/db

      - name: Sincronizar jogos e classificação
        run: pnpm --filter @netfor/scraper matches
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          # O job avisa no Telegram só quando algo muda de fato — placar, tabela
          # ou escalação. Rodada sem novidade é silenciosa de propósito: são 48
          # execuções por dia, e avisar todas faria o bot ser silenciado.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Rede de segurança para o que o próprio script não consegue avisar:
      # falha de checkout, de instalação, ou processo morto pelo runner. Sem
      # isto, esse tipo de quebra some em silêncio — e silêncio é indistinguível
      # de "nada mudou".
      - name: Avisar falha no Telegram
        if: failure()
        uses: ./.github/actions/avisar-telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          texto: |
            🚨 <b>Sync de jogos</b> — o workflow falhou

            Placar, tabela e escalação podem estar desatualizados no site.
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">abrir o log</a>

name: Sync de jogos e classificação

on:
  schedule:
    # A cada 30 min. O GitHub estrangula cron em repositório público, então na
    # prática cai para ~30-60 min — suficiente para acompanhar placar sem ficar
    # cutucando o banco. Era */15, mas cada execução acorda o compute do Neon e
    # ele só suspende após 5 min ocioso: dobrar o intervalo corta pela metade as
    # horas de compute, que é o recurso escasso do plano free. O painel e o
    # workflow_dispatch servem de reforço manual em dia de jogo.
    #
    # Desde que o sync passou a revalidar só quando algo muda de fato, rodada
    # sem novidade não custa mais nada de cache.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: matches
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --filter @netfor/scraper --filter @netfor/db

      - name: Sincronizar jogos e classificação
        run: pnpm --filter @netfor/scraper matches
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}

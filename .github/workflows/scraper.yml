name: Scraper de notícias

on:
  schedule:
    # A cada 20 min (GitHub não garante pontualidade exata — ok p/ notícias)
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --filter @netfor/scraper --filter @netfor/db

      - name: Rodar scraper
        run: pnpm --filter @netfor/scraper start
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          # Não é segredo: hostname público do Worker, usado só quando a zona
          # devolve Managed Challenge ao runner (ver core/revalidate.ts).
          REVALIDATE_FALLBACK_URL: https://netfor.jejesavewords.workers.dev/api/revalidate

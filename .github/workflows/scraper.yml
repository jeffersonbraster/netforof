name: Scraper de notícias

on:
  schedule:
    # A cada 20 min (GitHub não garante pontualidade exata — ok p/ notícias)
    # De hora em hora entre 8h e 23h (BRT = UTC-3), pausado de madrugada.
    # Portal de futebol não publica às 4 da manhã, e cada rodada custa chamada
    # de IA na reescrita. 16 coletas/dia cobrem o noticiário sem desperdício.
    - cron: "0 11-23,0-2 * * *"
  workflow_dispatch:

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No nível do job porque `env` de um step não é visível no `if` do próprio
    # step — e `secrets` não pode ser lido direto em `if`. Assim a reescrita é
    # pulada com aviso enquanto o segredo não existir, em vez de quebrar a
    # coleta.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --filter @netfor/scraper --filter @netfor/db

      - name: Rodar scraper
        run: pnpm --filter @netfor/scraper start
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}

      # Sem esta etapa a coleta enche a fila de rascunhos e NADA é publicado —
      # foi o que aconteceu: 27 matérias paradas e nenhuma publicação nova.
      # A coleta só grava título/link; é a reescrita que produz o texto próprio,
      # e sem texto próprio a página não é indexável (Modo B).
      #
      # `continue-on-error`: falha de reescrita não pode derrubar a coleta, que
      # já terminou com sucesso neste ponto. A matéria fica em rascunho e volta
      # na próxima rodada.
      #
      # REWRITE_BATCH baixo de propósito — é a única etapa que custa dinheiro
      # (chamada de IA). 5 por rodada × 16 rodadas cobre folgado as ~12
      # matérias/dia que os portais publicam, sem risco de conta inesperada.
      #
      # REVALIDATE_*: só usados quando a publicação automática está ligada no
      # painel — aí a matéria já entra no ar e o cache precisa cair na hora.
      # TELEGRAM_*: opcionais; sem eles a rodada segue e só não avisa.
      - name: Reescrever matérias pendentes
        id: reescrita
        if: env.OPENAI_API_KEY != ''
        continue-on-error: true
        run: pnpm --filter @netfor/scraper rewrite
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REWRITE_BATCH: "5"
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Avisar que a reescrita foi pulada
        if: env.OPENAI_API_KEY == ''
        run: echo "::warning::OPENAI_API_KEY ausente — matérias ficam em rascunho e nada é publicado."

      # A reescrita roda com `continue-on-error`, entao uma falha dela NAO marca
      # o job como falho e o passo de `failure()` abaixo nunca dispararia. Sem
      # este aviso proprio, a etapa que custa dinheiro e que produz o texto
      # publicavel poderia quebrar silenciosamente por dias — o sintoma seria uma
      # pilha de rascunhos que ninguem ve.
      - name: Avisar falha da reescrita
        if: steps.reescrita.outcome == 'failure'
        uses: ./.github/actions/avisar-telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          texto: |
            🚨 <b>Reescrita</b> — falhou nesta rodada

            A coleta funcionou; o texto próprio não foi gerado. As matérias ficam
            em <b>Sem texto próprio</b> e não vão ao ar até a reescrita voltar.
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">abrir o log</a>

      - name: Avisar falha no Telegram
        if: failure()
        uses: ./.github/actions/avisar-telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          texto: |
            🚨 <b>Coleta de matérias</b> — o workflow falhou

            Nenhuma matéria nova entrou nesta rodada.
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">abrir o log</a>

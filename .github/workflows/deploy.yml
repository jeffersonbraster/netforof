name: Deploy (Cloudflare Workers)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build + deploy no Cloudflare Workers
        # `run` é obrigatório: `pnpm deploy` sem ele invoca o comando EMBUTIDO do
        # pnpm (empacotar workspace), que falha na hora sem chamar o OpenNext.
        run: pnpm --filter @netfor/web run deploy
        env:
          # Build (SSG consulta o banco) + adapter
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          # Públicas (aparecem no HTML), então vão como `vars`, não `secrets`.
          # Sem isto, preencher a env no .env local não tem efeito no deploy.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT_LEADERBOARD: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_LEADERBOARD }}
          NEXT_PUBLIC_ADSENSE_SLOT_RECTANGLE: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_RECTANGLE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Worker separado, com cron próprio. Vai junto para não virar código órfão:
      # sem esta etapa, editar o vigia e dar push não publicaria nada, e a falha
      # apareceria só como banner parado dias depois.
      #
      # `wrangler deploy` não apaga secrets já definidos, então DATABASE_URL e
      # REVALIDATE_SECRET do worker seguem valendo sem passar por aqui.
      - name: Deploy do vigia de revalidação
        run: pnpm --filter @netfor/worker-revalidacao run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Segredo do GitHub e segredo do Worker são cofres SEPARADOS: o primeiro
      # vive na máquina que roda o deploy e desliga com ela; o segundo é lido
      # pelo worker na borda, muito depois, via `env`. `wrangler deploy` não
      # copia um para o outro.
      #
      # Este passo faz a cópia, para o GitHub ser a única fonte da verdade. Sem
      # ele, a mesma credencial vive em dois lugares e sai de sincronia sem
      # ninguém perceber — o sintoma seria o vigia mudo, que é indistinguível de
      # "não houve jogo".
      #
      # `wrangler secret put` lê de stdin quando não há terminal, então o VALOR
      # nunca aparece na linha de comando — que vai inteira para o log da
      # execução. O nome é literal fixo aqui, então não passa por interpolação.
      #
      # Só roda quando os secrets existem: sem eles o `put` gravaria string
      # vazia, e aí o vigia acharia que está configurado e falharia no envio.
      - name: Sincronizar secrets do Telegram no worker
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        working-directory: packages/worker-revalidacao
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$TELEGRAM_CHAT_ID"   | npx wrangler secret put TELEGRAM_CHAT_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Token com que o vigia acorda o job de jogos ~80 min antes do apito. Vem
      # daqui pelo mesmo motivo dos secrets do Telegram: o GitHub é a fonte da
      # verdade, e credencial copiada à mão para o dashboard sai de sincronia
      # sem ninguém perceber.
      #
      # `secrets` não pode ser usado em `if:`, então o valor passa antes pelo
      # `env:` do passo e a condição olha para ele. Sem o secret, o passo é
      # pulado e o vigia segue funcionando — só não acorda o Actions.
      - name: Sincronizar token de dispatch no worker
        if: env.GH_DISPATCH_TOKEN != ''
        working-directory: packages/worker-revalidacao
        run: printf '%s' "$GH_DISPATCH_TOKEN" | npx wrangler secret put GITHUB_DISPATCH_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}

      # Deploy avisa SEMPRE, nos dois desfechos: acontece poucas vezes por dia e
      # é a única mudança que parte de uma acao humana. Saber que o que foi
      # empurrado chegou (ou nao) ao ar vale a mensagem.
      - name: Avisar deploy no Telegram
        if: always()
        uses: ./.github/actions/avisar-telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          texto: |
            ${{ job.status == 'success' && '🚀 <b>Deploy</b> — no ar' || '🚨 <b>Deploy</b> — falhou' }}

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">ver a execução</a>
          citacao: ${{ github.event.head_commit.message || 'execução manual' }}
